spring:
  application:
    name: ucsg-analytics-backend

  # ── Serialización JSON ─────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Guayaquil

  # ── Correo electrónico (Mailtrap sandbox) ─────────────────────────
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: "876fb3db99cb61"
    password: "175a1603cbeaf7"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ── Base de datos ──────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/ucsg_analytics
    username: "postgres"
    password: "postgres"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate            # Flyway gestiona el esquema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false

  # ── Flyway (migraciones) ───────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  # ── Cache (Caffeine — in-memory) ──────────────────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

# ── Servidor ────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Configuración de la Aplicación ──────────────────────────────────
app:
  security:
    jwt:
      secret: "esta-es-una-clave-secreta-muy-larga-para-desarrollo-local-ucsg-2026"
      expiration-ms: 86400000      # 24 horas
      refresh-expiration-ms: 604800000  # 7 días
    max-failed-attempts: 5

  # ── Instagram API with Instagram Login ─────────────────────────────
  # Token de tipo "IGA..." generado como Instagram tester en la app
  # UCSG-Notificaciones-IG (Instagram App ID 4581798622096878) — por eso
  # base-url es graph.instagram.com. NO mezclar con tokens "EAA..." de la
  # Facebook Graph API (esos son de graph.facebook.com, otro producto).
  instagram:
    account-id: "17841423691798765"
    access-token: "IGABBHHx9Nbe5BZAFpCVF9YU2JwZAElNRUwwaUdIUWg0TEp5MzkzcU9teXBFdXExU1gyUk9HMEFjTWpwUmJXNkFVdjA0VTVEYndhVWxlQ0dHeTBhMVZAPYjFJa0V4cVNGbzIwb1YyX0JDbjVOOTlZAeEhwalpNNG5DX2tYc0xCQmF0MAZDZD"
    # app-id / app-secret: identidad de la app de Meta — usados para refrescar
    # el access token de larga duración antes de que expire (cada ~60 días).
    app-id: "4581798622096878"
    app-secret: "6aed208a62988f23bdcedc1d11060d45"
    base-url: https://graph.instagram.com/v19.0
    cron-expression: "0 0 */2 * * *"
    days-lookback: 180

  # ── Correo — configuración de la aplicación ───────────────────────
  mail:
    from: noreply@ucsg.edu.ec
    from-name: UCSG Campus Analytics

  # ── Frontend (usado en links de correo) ───────────────────────────
  frontend:
    url: http://localhost:3000

# ── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    ec.ucsg.analytics: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# Perfil de desarrollo local
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    clean-on-validation-error: false

---
# Perfil de producción
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
logging:
  level:
    ec.ucsg.analytics: INFO
    org.springframework.security: WARN